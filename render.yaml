# Render Blueprint — provisions the NestJS API + a managed PostgreSQL database.
# Deploy via: Render Dashboard → New → Blueprint → pick this repo.
#
# Single source of truth for the Prisma schema stays SQLite (schema.prisma).
# At build time we derive a Postgres variant by swapping the datasource
# provider, so the same models run on Postgres without maintaining two files.

databases:
  - name: booking-db
    plan: free

services:
  - type: web
    name: booking-api
    runtime: node
    plan: free
    rootDir: .
    # NOTE: the build syncs the schema but does NOT seed — seeding is
    # destructive for demo data and must not run on every deploy. Seed once
    # via the Render shell:  SEED_DEMO=force pnpm --filter @booking/api db:seed
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      sed 's/provider = "sqlite"/provider = "postgresql"/' apps/api/prisma/schema.prisma > apps/api/prisma/schema.prod.prisma
      pnpm --filter @booking/api exec prisma generate --schema=prisma/schema.prod.prisma
      pnpm --filter @booking/api build
      pnpm --filter @booking/api exec prisma db push --schema=prisma/schema.prod.prisma --skip-generate
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      # Lock CORS to the Netlify frontend. Update if your frontend URL changes.
      - key: CORS_ORIGINS
        value: "https://dynamic-jalebi-68b855.netlify.app"
